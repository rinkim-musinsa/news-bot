name: Keepalive
on:
  schedule:
    - cron: '0 0 1 * *'  # 매월 1일 자동 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Keep repository active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive commit to prevent 60-day inactivity suspension"
          git push
